name: CI/CD Pipeline - Deploy to AWS EC2

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write # Required to push container images to GitHub Container Registry (GHCR)

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─── 1. CI Stage: Build & Verify ──────────────────────────────────────────
  build-and-test:
    name: CI - Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        run: bun run build

  # ─── 2. CD Stage: Build Docker & Deploy to AWS EC2 via SSH ────────────────
  deploy:
    name: CD - Deploy to AWS EC2
    needs: build-and-test
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and Push Docker Container Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Copy docker-compose.yml to EC2 Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          source: "docker-compose.yml"
          target: "~/app/"

      - name: Execute Remote Deployment on AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          GITHUB_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          envs: DOCKER_IMAGE,GITHUB_USER,GITHUB_TOKEN
          script: |
            set -e
            echo "🚀 Deploying to AWS EC2 instance..."
            mkdir -p ~/app
            cd ~/app
            
            # Log in to GHCR on EC2 host
            if [ -n "$GITHUB_TOKEN" ]; then
              echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_USER" --password-stdin || true
            fi

            # Pull latest image and recreate container with docker compose
            DOCKER_IMAGE=$DOCKER_IMAGE docker compose pull || DOCKER_IMAGE=$DOCKER_IMAGE docker-compose pull
            DOCKER_IMAGE=$DOCKER_IMAGE docker compose up -d --remove-orphans || DOCKER_IMAGE=$DOCKER_IMAGE docker-compose up -d --remove-orphans
            
            # Prune dangling Docker images to free disk space
            docker image prune -f
            echo "✅ Deployment completed successfully!"
