  # ─── Development: hot-reload with bun dev server ─────────────────────────────
  dev:
    image: oven/bun:1
    container_name: profile-web-app-dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "4321:4321"
    command: bun run dev --host 0.0.0.0
    environment:
      - NODE_ENV=development
    profiles:
      - dev

networks:
