services:
  # ─── Production: build static site and serve with nginx ──────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: profile-web-app
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost/" ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    labels:
      - "com.profile-web-app.description=Profile Web Application (Production)"

  # ─── Development: hot-reload with bun dev server ─────────────────────────────
  dev:
    image: oven/bun:1
    container_name: profile-web-app-dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "4321:4321"
    command: bun run dev --host 0.0.0.0
    environment:
      - NODE_ENV=development
    profiles:
      - dev
